      - name: Analysis of Jeonse Loans Data in Seoul's Gwanak District
        summary: Data analysis project, Jun 2022
        highlights:
          - Collected Jeonse price data through web scraping and analyzed it with multiple regression, hedonic price modeling, and machine learning.
          - Found a 25% Jeonse price difference associated with loan eligibility.

